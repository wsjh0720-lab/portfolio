name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
      - run: npm ci
      - run: npm run build
      - run: |
          npx gh-pages -d out -r https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git -u "github-actions <actions@github.com>" -m "deploy"

